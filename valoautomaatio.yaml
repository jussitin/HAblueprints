
blueprint:
  name: Valoautomaatio napilla - brightness and RGB
  description: >
    Sytyttää ja sammuttaa valon napilla. Nopeat peräkkäiset
    painallukset vaihtavat low, medium ja high -asetusten välillä.
    Jokaisella asetuksella voi valita värilämpötilan (Kelvin)
    tai RGB-värin. Ajastimen oletettu kesto on 3 sekuntia.
  domain: automation

  input:
    # ZHA remote button
    remote_device:
      name: Painike
      description: ZHA-painike tai kaukosäädin
      selector:
        device:
          filter:
            - integration: zha

    # Light to control
    light_entity:
      name: Ohjattava valo
      selector:
        entity:
          domain: light

    # Timer helper, configured separately for each light
    timer_entity:
      name: Painallusten ajastin
      description: Luo erillinen timer-apuri jokaiselle valolle.
      selector:
        entity:
          domain: timer

    # Dropdown helper: low, medium, high
    preset_helper:
      name: Valotilan valitsin
      description: >
        input_select-apuri, jonka vaihtoehdot ovat low, medium, high.
      selector:
        entity:
          domain: input_select

    # LOW preset
    brightness_low:
      name: Himmeän tilan kirkkaus
      default: 1
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    color_mode_low:
      name: Himmeän tilan väritila
      default: kelvin
      selector:
        select:
          options:
            - label: Värilämpötila (Kelvin)
              value: kelvin
            - label: RGB-väri
              value: rgb

    # Native Kelvin gradient selector
    kelvin_low:
      name: Himmeän tilan värilämpötila
      default: 2000
      selector:
        color_temp:
          unit: kelvin
          min: 1000
          max: 10000

    # Native RGB color picker
    rgb_low:
      name: Himmeän tilan RGB-väri
      default: [255, 140, 60]
      selector:
        color_rgb: {}

    # MEDIUM preset
    brightness_medium:
      name: Keskimmäisen tilan kirkkaus
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    color_mode_medium:
      name: Keskimmäisen tilan väritila
      default: kelvin
      selector:
        select:
          options:
            - label: Värilämpötila (Kelvin)
              value: kelvin
            - label: RGB-väri
              value: rgb

    kelvin_medium:
      name: Keskimmäisen tilan värilämpötila
      default: 3000
      selector:
        color_temp:
          unit: kelvin
          min: 1000
          max: 10000

    rgb_medium:
      name: Keskimmäisen tilan RGB-väri
      default: [255, 180, 100]
      selector:
        color_rgb: {}

    # HIGH preset
    brightness_high:
      name: Kirkkaan tilan kirkkaus
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    color_mode_high:
      name: Kirkkaan tilan väritila
      default: kelvin
      selector:
        select:
          options:
            - label: Värilämpötila (Kelvin)
              value: kelvin
            - label: RGB-väri
              value: rgb

    kelvin_high:
      name: Kirkkaan tilan värilämpötila
      default: 5000
      selector:
        color_temp:
          unit: kelvin
          min: 1000
          max: 10000

    rgb_high:
      name: Kirkkaan tilan RGB-väri
      default: [255, 255, 255]
      selector:
        color_rgb: {}

# Trigger on a short press
trigger:
  - platform: device
    device_id: !input remote_device
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press

condition: []

action:
  # Make the blueprint inputs available to templates
  - variables:
      low_mode: !input color_mode_low
      medium_mode: !input color_mode_medium
      high_mode: !input color_mode_high

  - choose:
      # CASE 1: Light is off - turn it on
      - conditions:
          - condition: state
            entity_id: !input light_entity
            state: "off"
        sequence:
          - choose:
              # Nighttime: start at low
              - conditions:
                  - condition: sun
                    after: sunset
                    before: sunrise
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: low

                  # Apply the selected low color mode
                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ low_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input brightness_low
                              rgb_color: !input rgb_low
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_low
                          color_temp_kelvin: !input kelvin_low

            # Daytime: start at high
            default:
              - action: input_select.select_option
                target:
                  entity_id: !input preset_helper
                data:
                  option: high

              # Apply the selected high color mode
              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ high_mode == 'rgb' }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_high
                          rgb_color: !input rgb_high
                default:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_high
                      color_temp_kelvin: !input kelvin_high

      # CASE 2: Light is on and timer is active - cycle preset
      - conditions:
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: state
            entity_id: !input timer_entity
            state: "active"
        sequence:
          - choose:
              # LOW -> HIGH
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: low
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: high

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ high_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input brightness_high
                              rgb_color: !input rgb_high
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_high
                          color_temp_kelvin: !input kelvin_high

              # HIGH -> MEDIUM
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: high
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: medium

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ medium_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input brightness_medium
                              rgb_color: !input rgb_medium
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_medium
                          color_temp_kelvin: !input kelvin_medium

              # MEDIUM -> LOW
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: medium
                sequence:
                  - action: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: low

                  - choose:
                      - conditions:
                          - condition: template
                            value_template: "{{ low_mode == 'rgb' }}"
                        sequence:
                          - action: light.turn_on
                            target:
                              entity_id: !input light_entity
                            data:
                              brightness_pct: !input brightness_low
                              rgb_color: !input rgb_low
                    default:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_low
                          color_temp_kelvin: !input kelvin_low

            # Recover to medium if helper has an unexpected value
            default:
              - action: input_select.select_option
                target:
                  entity_id: !input preset_helper
                data:
                  option: medium

              - choose:
                  - conditions:
                      - condition: template
                        value_template: "{{ medium_mode == 'rgb' }}"
                    sequence:
                      - action: light.turn_on
                        target:
                          entity_id: !input light_entity
                        data:
                          brightness_pct: !input brightness_medium
                          rgb_color: !input rgb_medium
                default:
                  - action: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_medium
                      color_temp_kelvin: !input kelvin_medium

    # CASE 3: Light is on and timer is inactive - turn it off
    default:
      - action: light.turn_off
        target:
          entity_id: !input light_entity

  # Restart the timer after every button press
  - action: timer.start
    target:
      entity_id: !input timer_entity
    data:
      duration: "00:00:03"

mode: restart
