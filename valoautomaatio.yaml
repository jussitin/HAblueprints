
blueprint:
  name: Valoautomaatio napilla - preset cycling
  description: >
    Sytyttää valon ensimmäisellä painalluksella.
    Nopeat peräkkäiset painallukset vaihtavat low, medium
    ja high -asetusten välillä. Kun painallusväli ylittää
    ajastimen keston, seuraava painallus sammuttaa valon.
  domain: automation

  input:
    remote_device:
      name: Painike
      selector:
        device:
          filter:
            - integration: zha

    light_entity:
      name: Ohjattava valo
      selector:
        entity:
          domain: light

    timer_entity:
      name: Painallusten ajastin
      description: Ajastimen kesto määrittää painallusikkunan.
      selector:
        entity:
          domain: timer

    preset_helper:
      name: Valotilan valitsin
      description: >
        Luo input_select-apuri, jossa vaihtoehdot ovat
        low, medium ja high.
      selector:
        entity:
          domain: input_select

    brightness_low:
      name: Himmeä kirkkaus
      default: 1
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    brightness_medium:
      name: Keskitasoinen kirkkaus
      default: 30
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    brightness_high:
      name: Suuri kirkkaus
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    kelvin_low:
      name: Himmeän tilan värilämpötila
      default: 2000
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K

    kelvin_medium:
      name: Keskimmäisen tilan värilämpötila
      default: 4384
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K

    kelvin_high:
      name: Kirkkaan tilan värilämpötila
      default: 4506
      selector:
        number:
          min: 1000
          max: 10000
          unit_of_measurement: K

trigger:
  - platform: device
    device_id: !input remote_device
    domain: zha
    type: remote_button_short_press
    subtype: remote_button_short_press

condition: []

action:
  - choose:
      # First press: lamp is off
      - conditions:
          - condition: state
            entity_id: !input light_entity
            state: "off"
        sequence:
          - choose:
              # Start low at night
              - conditions:
                  - condition: sun
                    after: sunset
                    before: sunrise
                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: low
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_low
                      color_temp_kelvin: !input kelvin_low

            # Otherwise start high
            default:
              - service: input_select.select_option
                target:
                  entity_id: !input preset_helper
                data:
                  option: high
              - service: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: !input brightness_high
                  color_temp_kelvin: !input kelvin_high

      # Repeated press within the timer window
      - conditions:
          - condition: state
            entity_id: !input light_entity
            state: "on"
          - condition: state
            entity_id: !input timer_entity
            state: "active"
        sequence:
          - choose:
              # Low -> High
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: low
                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: high
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_high
                      color_temp_kelvin: !input kelvin_high

              # High -> Medium
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: high
                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: medium
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_medium
                      color_temp_kelvin: !input kelvin_medium

              # Medium -> Low
              - conditions:
                  - condition: state
                    entity_id: !input preset_helper
                    state: medium
                sequence:
                  - service: input_select.select_option
                    target:
                      entity_id: !input preset_helper
                    data:
                      option: low
                  - service: light.turn_on
                    target:
                      entity_id: !input light_entity
                    data:
                      brightness_pct: !input brightness_low
                      color_temp_kelvin: !input kelvin_low

            # Recover if helper has an unexpected state
            default:
              - service: input_select.select_option
                target:
                  entity_id: !input preset_helper
                data:
                  option: medium
              - service: light.turn_on
                target:
                  entity_id: !input light_entity
                data:
                  brightness_pct: !input brightness_medium
                  color_temp_kelvin: !input kelvin_medium

    # Light is on and the timer has expired: turn it off
    default:
      - service: light.turn_off
        target:
          entity_id: !input light_entity

  # Restart the timer after handling every press
  - service: timer.start
    target:
      entity_id: !input timer_entity

mode: restart
